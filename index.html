<!DOCTYPE html>
<html>
<head>
    <title>Muhammad Nazim</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #fafafa;
            color: #111;
        }

        header {
            padding: 80px 10%;
        }

        header h1 {
            font-size: 48px;
            margin: 0;
        }

        header p {
            margin-top: 10px;
            color: #555;
        }

        .projects {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            padding: 0 10% 60px;
        }

        .card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            transition: 0.3s;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #ddd;
        }

        .card-content {
            padding: 15px;
        }

        .card h3 {
            margin: 0;
            font-size: 18px;
        }

        .card p {
            margin-top: 5px;
            color: #666;
            font-size: 14px;
        }

    </style>
</head>
<body>

<header>
    <h1>Muhammad Nazim</h1>
    <p>Graphic Designer & Interactive Developer</p>
</header>

<section class="projects">

    <div class="card">
        <img src="">
        <div class="card-content">
            <h3>Packaging Design</h3>
            <p>Branding & visual identity</p>
        </div>
    </div>

    <div class="card">
        <img src="">
        <div class="card-content">
            <h3>Game UI Design</h3>
            <p>Unity interface & interaction</p>
        </div>
    </div>

    <div class="card">
        <img src="">
        <div class="card-content">
            <h3>AR Application</h3>
            <p>Interactive learning experience</p>
        </div>
    </div>

</section>

</body>
</html>
